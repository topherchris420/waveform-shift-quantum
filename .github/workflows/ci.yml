name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Lint & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (Strict TypeScript)
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Vitest scientific invariant test suite
        run: npm test

      - name: Vite production build
        run: npm run build
